<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Nephroctor">
  <!-- Raster monogram from assets/favicon-32.png; dark swap matches site tokens. -->
  <style>
    .dark { display: none }
    @media (prefers-color-scheme: dark) {
      .light { display: none }
      .dark { display: inline }
    }
  </style>
  <image class="light" width="32" height="32" href="data:image/png;base64,"/>
  <image class="dark" width="32" height="32" href="data:image/png;base64,"/>
</svg>
