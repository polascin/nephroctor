name: Deploy to WebSupport

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SFTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare deploy directory
        run: |
          mkdir -p deploy
          cp index.html robots.txt sitemap.xml site.webmanifest favicon.ico deploy/
          cp .htaccess deploy/
          cp -r assets deploy/
          cp -r legal deploy/
          # logo-transparent.* is kept in the repository for history but is not
          # used by any page: it is RGB with no alpha channel and carries a
          # transparency checkerboard baked into its pixels (see Beh #7).
          # Shipping it would publish 1.1 MB of a defective asset.
          rm -f deploy/assets/logo-transparent.png deploy/assets/logo-transparent.webp
          echo "Files staged for deployment:"
          find deploy -type f | sort
          echo "Payload size: $(du -sh deploy | cut -f1)"

      - name: Verify deploy payload
        run: |
          fail=0
          for f in index.html robots.txt sitemap.xml site.webmanifest favicon.ico .htaccess \
                   assets/site.css assets/legal.js assets/logo.webp assets/og-image.jpg \
                   assets/favicon.ico assets/apple-touch-icon.png \
                   assets/fonts/inter-latin.woff2 assets/fonts/inter-latin-ext.woff2 \
                   legal/.htaccess \
                   legal/ochrana-osobnych-udajov.html legal/cookies.html \
                   legal/podmienky-pouzivania.html legal/pravne-informacie.html \
                   legal/pristupnost.html legal/zdravotne-upozornenie.html; do
            if [ ! -s "deploy/$f" ]; then
              echo "::error::missing or empty in deploy payload: $f"
              fail=1
            fi
          done
          exit $fail

      - name: Deploy via SFTP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null 2>&1
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" \
            -e "set sftp:connect-program 'ssh -o StrictHostKeyChecking=no -p $SFTP_PORT'; \
                mirror --reverse --verbose --delete deploy/ $SFTP_REMOTE_PATH/; \
                bye" \
            sftp://"$SFTP_HOST"
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}

      - name: Smoke check
        run: |
          sleep 5
          fail=0
          # A browser User-Agent is required: the host's bot protection answers
          # bare curl with HTTP 466, which would fail the check spuriously.
          # Bursts from Actions IPs often get HTTP 429; retry briefly and
          # succeed as soon as the expected status appears. Warnings MUST go
          # to stderr: STATUS=$(curl_status …) would otherwise capture
          # "::warning::…" lines and fail even after a final 200/301
          # (seen on run 41280258152: "returned …200 instead of 200").
          # Keep total wait short: 8 attempts × 10…60s + 10s between 22 URLs
          # hung Deploy run 41283050668 for ~18 minutes on Smoke check alone.
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          curl_status() {
            # curl_status <url> [header-file]
            # Prints only the final HTTP status code on stdout. Retries 429/466
            # with short backoff (3s…12s) up to 4 attempts; returns as soon as
            # a non-rate-limit status is seen (success after N retries).
            local url="$1" hdr_file="${2:-}"
            local attempt=1 max=4 delay=3 status
            while true; do
              if [ -n "$hdr_file" ]; then
                : > "$hdr_file"
                status=$(curl -s -D "$hdr_file" -o /dev/null -A "$UA" \
                  --connect-timeout 10 --max-time 20 \
                  -w "%{http_code}" "$url" || echo "000")
              else
                status=$(curl -s -o /dev/null -A "$UA" \
                  --connect-timeout 10 --max-time 20 \
                  -w "%{http_code}" "$url" || echo "000")
              fi
              case "$status" in
                429|466)
                  if [ "$attempt" -ge "$max" ]; then
                    printf '%s\n' "$status"
                    return 0
                  fi
                  echo "::warning::$url returned $status (attempt $attempt/$max); retrying in ${delay}s" >&2
                  sleep "$delay"
                  delay=$((delay * 2))
                  [ "$delay" -gt 12 ] && delay=12
                  attempt=$((attempt + 1))
                  ;;
                *)
                  printf '%s\n' "$status"
                  return 0
                  ;;
              esac
            done
          }
          for path in / \
                      /robots.txt \
                      /sitemap.xml \
                      /site.webmanifest \
                      /favicon.ico \
                      /assets/site.css \
                      /assets/legal.js \
                      /assets/og-image.jpg \
                      /assets/fonts/inter-latin.woff2 \
                      /legal/ochrana-osobnych-udajov.html \
                      /legal/cookies.html \
                      /legal/podmienky-pouzivania.html \
                      /legal/pravne-informacie.html \
                      /legal/pristupnost.html \
                      /legal/zdravotne-upozornenie.html; do
            STATUS=$(curl_status "https://nephroctor.com$path")
            printf '%-45s %s\n' "$path" "$STATUS"
            if [ "$STATUS" != "200" ]; then
              echo "::error::$path returned $STATUS instead of 200"
              fail=1
            fi
            sleep 2
          done
          # Legal shortcuts must 301 onto the canonical Slovak HTML documents.
          # /legal and /legal/ are both checked (slashless directory vs slash).
          # /legal/privacy.html and /legal/terms.html are English filename aliases.
          # A shell heredoc cannot be used here: unindented EOF bodies break
          # the YAML block scalar (GitHub Actions reports a syntax error).
          for spec in \
            "/privacy|/legal/ochrana-osobnych-udajov.html" \
            "/terms|/legal/podmienky-pouzivania.html" \
            "/cookies|/legal/cookies.html" \
            "/legal/privacy.html|/legal/ochrana-osobnych-udajov.html" \
            "/legal/terms.html|/legal/podmienky-pouzivania.html" \
            "/legal|/legal/pravne-informacie.html" \
            "/legal/|/legal/pravne-informacie.html"; do
            path="${spec%%|*}"
            expected="${spec##*|}"
            hdr=$(mktemp)
            STATUS=$(curl_status "https://nephroctor.com$path" "$hdr")
            LOCATION=$(tr -d '\r' < "$hdr" | awk 'BEGIN{IGNORECASE=1} /^location:/{print $2; exit}')
            rm -f "$hdr"
            printf '%-45s %s -> %s\n' "$path" "$STATUS" "$LOCATION"
            if [ "$STATUS" != "301" ]; then
              echo "::error::$path returned $STATUS instead of 301"
              fail=1
            elif ! printf '%s' "$LOCATION" | grep -q "$expected"; then
              echo "::error::$path Location was '$LOCATION', expected to contain $expected"
              fail=1
            fi
            sleep 2
          done
          exit $fail

      - name: Report security headers
        if: always()
        run: |
          sleep 3
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          # Informational only: .htaccess may be ignored if AllowOverride is off.
          curl -sI -A "$UA" https://nephroctor.com/ \
            | grep -iE '^(content-security-policy|x-content-type-options|referrer-policy|permissions-policy|strict-transport-security|x-frame-options):' \
            || echo "::warning::No security headers seen – check that .htaccess is honoured by the host"
